# Per-token greedy toward the layer-25 emotion vector with candidates restricted to neurons at a pole, the middle,
# or a same-size random middle subset (GPU, L4).
#   python scripts/raw_pools.py --config configs/raw_pools.yaml
run_id: raw_pools
model: Qwen/Qwen3-8B
layer: 25
data:
  heldout_story_idx: [5]
  heldout_neutral_idx: [10, 11]
  split_token: 50
harvest:
  corpora:
    - {name: fineweb-edu, path: HuggingFaceFW/fineweb-edu, config: sample-10BT, tokens: 70000}
    - {name: tinystories, path: roneneldan/TinyStories, tokens: 70000}
    - {name: ultrachat, path: HuggingFaceH4/ultrachat_200k, split: train_sft, field: messages, tokens: 70000}
