# Blind Haiku judging of layer-25 neurons: only in the signal set (method 2), in both sets, and random.
#   python scripts/judge_select.py --config configs/judge_sets.yaml --device cpu   # CPU
#   python scripts/judge_snippets.py --config configs/judge_sets.yaml                # GPU, L4
run_id: judge_sets
model: Qwen/Qwen3-8B
layer: 25
data:
  heldout_story_idx: [5]
  heldout_neutral_idx: [10, 11]
  split_token: 50
harvest:
  corpora:
    - {name: fineweb-edu, path: HuggingFaceFW/fineweb-edu, config: sample-10BT, tokens: 70000}
    - {name: tinystories, path: roneneldan/TinyStories, tokens: 70000}
    - {name: ultrachat, path: HuggingFaceH4/ultrachat_200k, split: train_sft, field: messages, tokens: 70000}
