# Small end-to-end check of the pipeline on a GPU: the happy set up to 40% of the write (36 neurons), ~90k tokens. L4, ~5 min.
#   python scripts/pipeline.py --config configs/pipeline_smoke_happy.yaml
run_id: pipeline_smoke_happy
model: Qwen/Qwen3-8B
layer: 25
emotion: happy
harvest:
  neurons_csv: results/greedy_sets_l25/neurons/happy.csv
  rebuilt_pct: 40
  n_controls: 4
  corpora:
    - {name: fineweb-edu, path: HuggingFaceFW/fineweb-edu, config: sample-10BT, tokens: 30000}
    - {name: tinystories, path: roneneldan/TinyStories, tokens: 30000}
    - {name: ultrachat, path: HuggingFaceH4/ultrachat_200k, split: train_sft, field: messages, tokens: 30000}
modes:
  checks: 50
