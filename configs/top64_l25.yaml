# The smallest neuron sets that keep each emotion's layer-25 MLP write direction, and the modes of the top 64.
#   python scripts/min_set.py --config configs/top64_l25.yaml   # CPU; greedy selection -> results/top64_l25/selection.json
#   python scripts/harvest.py --config configs/top64_l25.yaml   # GPU, ~2M tokens to layer 25
#   python scripts/modes.py   --config configs/top64_l25.yaml   # GPU (inputs at hits) + CPU HDBSCAN
run_id: top64_l25
model: Qwen/Qwen3-8B
layer: 25
neuron_set:
  vectors_run: stage2_l25
min_set:
  greedy_steps: 2000
  select: 64        # round-robin down the 12 greedy orders
harvest:
  neurons_file: results/top64_l25/selection.json
  n_controls: 20
  window: 256
  batch_size: 32
modes:
  n_controls: 0     # controls' modes were named in stage3_l25
  min_cluster_size: 10
  neurons_per_batch: 8
