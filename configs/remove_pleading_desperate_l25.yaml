# Remove the "Pleading and begging dialogue" neurons from the desperate write; compare both vectors on held-out stories.
#   python scripts/theme_removal.py --config configs/remove_pleading_desperate_l25.yaml          # CPU, seconds
#   python scripts/token_scores.py  --config configs/remove_pleading_desperate_l25.yaml          # GPU, per-token cosines
#   python scripts/token_report.py  --config configs/remove_pleading_desperate_l25.yaml          # CPU, circuitsvis page
run_id: remove_pleading_desperate_l25
model: Qwen/Qwen3-8B
layer: 25
emotion: desperate
sums_run: stage2_l25
removal:
  modes_run: harvest_desperate_l25
  theme: Pleading and begging dialogue
  not_emotion_themes:
    - Once-upon-a-time children's stories
    - other
    - unassigned
    - Subject pronoun after a bad event
    - Paragraph breaks and quote marks
    - Recipes, advice lists and chat
    - Citations, code and reference lists
    - Medical and scientific text
