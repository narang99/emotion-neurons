# Three directions of each emotion's layer-25 MLP write (main, modes = sparse-set tail firings, remaining), with
# logit lens, top tokens and example sentences (GPU, L4).
#   python scripts/direction_reports.py --config configs/direction_reports.yaml
run_id: direction_reports
model: Qwen/Qwen3-8B
layer: 25
data:
  heldout_story_idx: [5]
  heldout_neutral_idx: [10, 11]
  split_token: 50
harvest:
  corpora:
    - {name: fineweb-edu, path: HuggingFaceFW/fineweb-edu, config: sample-10BT, tokens: 70000}
    - {name: tinystories, path: roneneldan/TinyStories, tokens: 70000}
    - {name: ultrachat, path: HuggingFaceH4/ultrachat_200k, split: train_sft, field: messages, tokens: 70000}
