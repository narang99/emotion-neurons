# Patching scan for n3068 ("pride") at hits that are NOT a pride word, e.g. "puffing up his chest" (GPU, L4).
# The swapped token is still the hit token itself.
#   python scripts/chain_scan.py --config configs/chain_scan_3068_context.yaml
run_id: chain_scan_3068_context
model: Qwen/Qwen3-8B
data:
  heldout_story_idx: [5]
  heldout_neutral_idx: [10, 11]
  split_token: 50
chain:
  target: [25, 3068]
  band: 0
  exclude_pattern: "^(proud|pride|prouder|der|骄傲|自豪|驕傲)"
