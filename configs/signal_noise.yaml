# Signal (non-zero mean push), noise and offset (constant) neurons along each layer-25 emotion vector, from raw
# story-level pushes; modes of the strongest offset and specific neurons (GPU, L4).
#   python scripts/signal_noise.py --config configs/signal_noise.yaml
run_id: signal_noise
model: Qwen/Qwen3-8B
layer: 25
data:
  heldout_story_idx: [5]
  heldout_neutral_idx: [10, 11]
  split_token: 50
harvest:
  corpora:
    - {name: fineweb-edu, path: HuggingFaceFW/fineweb-edu, config: sample-10BT, tokens: 70000}
    - {name: tinystories, path: roneneldan/TinyStories, tokens: 70000}
    - {name: ultrachat, path: HuggingFaceH4/ultrachat_200k, split: train_sft, field: messages, tokens: 70000}
