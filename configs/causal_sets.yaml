# Causal test of the layer-25 sparse sets: remove or swap an emotion's activation shift (GPU, L4).
#   python scripts/causal_sets.py --config configs/causal_sets.yaml
run_id: causal_sets
model: Qwen/Qwen3-8B
layer: 25
data:
  heldout_story_idx: [5]
  heldout_neutral_idx: [10, 11]
  split_token: 50
causal_sets:
  read_layers: [25, 28, 31, 35]
  random_sets: 3
  swap_scales: [1.0, 4.0]
