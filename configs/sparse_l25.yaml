# Sparse neuron sets per emotion write at layer 25: hill-climb size vs direction (CPU; needs Stage 2's vectors and
# runs/stage2_l25/{sums.safetensors,stories.json} from s3://narang99-private/emotion-neurons/stage2_l25/runs/).
#   python scripts/sparse_set.py --config configs/sparse_l25.yaml
run_id: sparse_l25
model: Qwen/Qwen3-8B
layer: 25
neuron_set:
  vectors_run: stage2_l25
sparse_set:
  taus: [0.8, 0.9, 0.95]
  sizes: [16, 64, 128, 256, 512, 1024, 2048]
  greedy_steps: 2500
  max_swaps: 2000
