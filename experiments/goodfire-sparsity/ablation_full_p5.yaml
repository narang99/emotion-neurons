# Step 1: mean-ablate every neuron between its p5 and p95 in all 32 MLPs of Qwen-1 7B Chat, and a random control
# that ablates as many neurons per token. Loss and KL against the intact model.
#   python scripts/ablation.py --config experiments/goodfire-sparsity/ablation_full_p5.yaml   # GPU, L4
run_id: ablation_full_p5
model:
  family: qwen1
  name: Qwen/Qwen-7B-Chat
  revision: 93a65d34827a3cc269b727e67004743b723e2f83
results_dir: experiments/goodfire-sparsity
thresholds: experiments/goodfire-sparsity/poles_qwen1_p5/thresholds.safetensors
low: p5
high: p95
# Held out from the poles run: same corpora, seed and windows, past the 70k tokens per corpus that the poles read.
text:
  batch_size: 8
  corpora:
    - {name: fineweb-edu, path: HuggingFaceFW/fineweb-edu, config: sample-10BT, skip_tokens: 70000, tokens: 35000}
    - {name: tinystories, path: roneneldan/TinyStories, skip_tokens: 70000, tokens: 35000}
    - {name: ultrachat, path: HuggingFaceH4/ultrachat_200k, split: train_sft, field: messages, skip_tokens: 70000, tokens: 35000}
# KL at the post-instruction positions of the refusal val prompts (32 per side, as in refusal_qwen1.yaml).
prompts:
  kind: instructions
  n_train: 128
  n_val: 32
  seed: 42
  categories:
    harmful:
      train: ["https://raw.githubusercontent.com/andyrdt/refusal_direction/main/dataset/splits/harmful_train.json"]
      val: ["https://raw.githubusercontent.com/andyrdt/refusal_direction/main/dataset/splits/harmful_val.json"]
    harmless:
      train: ["https://raw.githubusercontent.com/andyrdt/refusal_direction/main/dataset/splits/harmless_train.json"]
      val: ["https://raw.githubusercontent.com/andyrdt/refusal_direction/main/dataset/splits/harmless_val.json"]
ablations:
  - {kind: band}
  - {kind: random}
