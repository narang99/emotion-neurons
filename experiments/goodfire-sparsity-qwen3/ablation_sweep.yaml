# The p3/p97 band ablation of layers k to 35 of Qwen3-8B, for k = 1..35; layers before k stay intact.
#   python scripts/ablation.py --config experiments/goodfire-sparsity-qwen3/ablation_sweep.yaml   # GPU, L4
run_id: ablation_sweep
model: Qwen/Qwen3-8B
results_dir: experiments/goodfire-sparsity-qwen3
thresholds: experiments/goodfire-sparsity-qwen3/poles_qwen3/thresholds.safetensors
# Held out from the poles run: same corpora, seed and windows, past the 70k tokens per corpus that the poles read.
text:
  batch_size: 4
  corpora:
    - {name: fineweb-edu, path: HuggingFaceFW/fineweb-edu, config: sample-10BT, skip_tokens: 70000, tokens: 35000}
    - {name: tinystories, path: roneneldan/TinyStories, skip_tokens: 70000, tokens: 35000}
    - {name: ultrachat, path: HuggingFaceH4/ultrachat_200k, split: train_sft, field: messages, skip_tokens: 70000, tokens: 35000}
low: p3
high: p97
ablations:
  - {kind: band, start: 1}
  - {kind: band, start: 2}
  - {kind: band, start: 3}
  - {kind: band, start: 4}
  - {kind: band, start: 5}
  - {kind: band, start: 6}
  - {kind: band, start: 7}
  - {kind: band, start: 8}
  - {kind: band, start: 9}
