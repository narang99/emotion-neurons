# The refusal direction of Qwen-1 7B Chat, as in Arditi et al. 2024 (arXiv 2406.11717): harmful minus harmless
# instructions, 128 train + 32 val per side from the paper's published splits; layer and post-instruction position
# chosen by the effect of ablating and adding the direction; checked by generation.
#   python scripts/extract.py --config experiments/00-vector-extraction/refusal_qwen1.yaml   # GPU, L4: direction, checks, token views, report
run_id: refusal_qwen1
results_dir: experiments/00-vector-extraction/results
model:
  family: qwen1
  name: Qwen/Qwen-7B-Chat
  revision: 93a65d34827a3cc269b727e67004743b723e2f83
data:
  kind: instructions
  n_train: 128
  n_val: 32
  seed: 42
  categories:
    harmful:
      train: [{url: "https://raw.githubusercontent.com/andyrdt/refusal_direction/main/dataset/splits/harmful_train.json"}]
      val: [{url: "https://raw.githubusercontent.com/andyrdt/refusal_direction/main/dataset/splits/harmful_val.json"}]
    harmless:
      train: [{url: "https://raw.githubusercontent.com/andyrdt/refusal_direction/main/dataset/splits/harmless_train.json"}]
      val: [{url: "https://raw.githubusercontent.com/andyrdt/refusal_direction/main/dataset/splits/harmless_val.json"}]
extraction:
  kind: direction
  target: harmful
  selection:
    refusal_tokens: ["I", "As"]
