[project]
name = "emotion-neurons"
version = "0.1.0"
description = "Emotion vectors in Qwen3-8B, and the poles of its layer-25 MLP neurons"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.0",
    "datasets>=2.14",
    "einops>=0.7",
    "jaxtyping>=0.2.25",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyyaml>=6",
    "safetensors>=0.4",
    "scikit-learn>=1.3",
    "torch>=2.4",
    "tqdm>=4.66",
    "transformers>=4.51",
]

# Floors are deliberately low (the in-tfm rule).
# - Colab preinstalls torch, numpy, transformers and accelerate, built against its own CUDA and ABI.
# - Any floor above those forces uv to reinstall them; for torch that swaps the +cu build for a generic wheel.
# - Raise a floor only for an API this code actually needs.
#   - transformers >=4.51: first release with Qwen3.
# - Colab 2026-11-18: python 3.13, torch 2.14.1+cu130, numpy 2.4.6, transformers 5.22.1.
#   Only pydantic-settings is missing there.

[build-system]
requires = ["uv_build>=0.8.13,<0.20.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I"]
# F722 / F821 read jaxtyping shape strings such as "batch seq" as syntax errors or undefined names.
ignore = ["E501", "F722", "F821"]

[dependency-groups]
dev = ["pytest>=8"]
